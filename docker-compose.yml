services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    mem_limit: 128m
    cpus: 0.25

  migrate:
    build:
      context: ./backend
    command: python manage.py migrate
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 0.5

  celery-worker:
    build:
      context: ./backend
    command: celery -A k8sbackend worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 0.5

  celery-beat:
    build:
      context: ./backend
    command: celery -A k8sbackend beat --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.25

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    mem_limit: 128m
    cpus: 0.25

volumes:
  postgres_data: